{% extends "base.html" %}

{% block content %}

<style>

body {
  background: #0b1220;
}

.reset-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 75vh;
  padding: 20px;
}

.reset-box {
  width: 100%;
  max-width: 420px;
  background: #111827;
  padding: 30px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.reset-box h2 {
  text-align: center;
  color: #60a5fa;
  margin-bottom: 20px;
  font-size: 20px;
}

/* INPUTS */
input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #1f2937;
  color: white;
  outline: none;
  transition: 0.2s;
}

input:focus {
  border: 1px solid #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}

/* BUTTON */
button {
  margin-top: 18px;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #16a34a;
  transform: translateY(-1px);
}

/* HELP TEXT */
.help-text {
  font-size: 12px;
  color: #9ca3af;
  margin-top: 10px;
  text-align: center;
}

/* ERROR LIST */
.errorlist {
  color: #f87171;
  font-size: 12px;
  list-style: none;
  padding-left: 0;
}

/* MOBILE */
@media (max-width: 480px) {
  .reset-box {
    padding: 22px;
  }
}

</style>

<div class="reset-container">
  <div class="reset-box">

    <h2>🔒 Create New Password</h2>

<form method="POST">
  {% csrf_token %}

  <!-- PASSWORD -->
  <div style="position:relative; margin-top:10px;">
    {{ form.new_password1 }}

    <span onclick="togglePassword('id_new_password1', this)"
      style="
        position:absolute;
        right:12px;
        top:50%;
        transform:translateY(-50%);
        cursor:pointer;
        font-size:12px;
        color:#60a5fa;
        user-select:none;
      ">
      Show
    </span>
  </div>

  <!-- CONFIRM PASSWORD -->
  <div style="position:relative; margin-top:15px;">
    {{ form.new_password2 }}

    <span onclick="togglePassword('id_new_password2', this)"
      style="
        position:absolute;
        right:12px;
        top:50%;
        transform:translateY(-50%);
        cursor:pointer;
        font-size:12px;
        color:#60a5fa;
        user-select:none;
      ">
      Show
    </span>
  </div>

  <button type="submit">
    Reset Password
  </button>
</form>

    <div class="help-text">
      Make sure your password is strong and easy for you to remember.
    </div>

  </div>
</div>

<script>
function togglePassword(id, el) {
    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        el.innerText = "Hide";
    } else {
        input.type = "password";
        el.innerText = "Show";
    }
}
</script>

{% endblock %}
