{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<style>

.auth-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 70vh;
}

.auth-card {
  width: 100%;
  max-width: 420px;
  background: #111827;
  padding: 25px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.06);
}

.auth-card h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #60a5fa;
}

form p {
  margin-bottom: 12px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #1f2937;
  color: white;
  outline: none;
}

input:focus {
  border: 1px solid #3b82f6;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #22c55e;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #16a34a;
}

.link {
  text-align: center;
  margin-top: 15px;
  font-size: 13px;
  color: #9ca3af;
}

.link a {
  color: #60a5fa;
  text-decoration: none;
}

</style>

<div class="auth-container">
  <div class="auth-card">

    <h2>Create Account</h2>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Sign Up</button>
    </form>

    <div class="link">
      Already have an account?
      <a href="/accounts/login/">Login</a>
    </div>

  </div>
</div>

{% endblock %}
